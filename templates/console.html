<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCI 实例管理</title><link rel="stylesheet" href="/static/console.css"></head>
<body><header><div class="brand"><span class="brand-icon">C</span><div><strong>CCI 管理台</strong><small>SenseCore · 本地控制台</small></div></div><nav><button class="selected" data-tab="instances">实例管理</button><button data-tab="gpu">GPU 余量</button></nav><span id="connection">连接中</span></header>
<main><section id="instances-page"><div class="page-heading"><div><h1>我的实例</h1><p>定时启停、周期续杯与独立操作记录</p></div><div class="heading-actions"><button id="instance-count" class="pill" title="编辑实例采样间隔" aria-haspopup="dialog"></button><button id="add-instance" class="primary">添加实例</button></div></div><div id="instances" class="cards"></div></section>
<dialog id="add-dialog" aria-labelledby="add-title"><div class="drawer-head"><div><h2 id="add-title">添加已有实例</h2><small>查询成功后自动读取状态、资源和镜像</small></div></div><form id="add-form" class="edit-form"><label>Workspace（工作空间）<input name="workspace" required placeholder="例如 share-space" maxlength="128"></label><label>实例名称<input name="name" required placeholder="例如 oneday-debug-5090-1x" maxlength="128"></label><p class="hint">填写控制台的“名称”，不是显示名称或UID。使用当前SCO账号、订阅和资源组查询。新增实例默认只监控，定时启停和周期续杯均关闭。</p><p id="add-error" class="error" role="alert" hidden></p><div class="form-actions"><button id="add-cancel" type="button">取消</button><button id="add-submit" type="submit" class="primary">查询并添加</button></div></form></dialog>
<section id="gpu-page" hidden><div class="page-heading"><div><h1>GPU 余量</h1><p>独立采样，仅用于观察资源变化</p></div><button id="gpu-edit">编辑监控</button></div><div id="gpu-settings"></div><div class="chart-panel"><div class="chart-toolbar"><select id="cluster-select" aria-label="集群"></select><select id="hours" aria-label="时间范围"><option value="8">最近 8 小时</option><option value="1">最近 1 小时</option><option value="24">最近 24 小时</option></select><span id="gpu-latest"></span></div><div class="chart"><canvas id="chart"></canvas><div id="tooltip" hidden></div></div><p id="chart-note">空闲 GPU · 查询失败显示断点</p></div></section></main>
<dialog id="sampling-dialog" aria-labelledby="sampling-title"><div class="drawer-head"><div><h2 id="sampling-title">实例状态采样</h2><small>所有受管实例的状态查询间隔，与GPU余量采样独立</small></div></div><form id="sampling-form" class="edit-form"><label>采样间隔（秒）<input name="interval" type="number" min="10" max="3600" step="1" required></label><p class="hint">保存后立即生效。操作执行期间仍会每5秒确认平台状态，启动就绪最多等待20分钟。</p><p id="sampling-error" class="error" role="alert" hidden></p><div class="form-actions"><button type="button" id="sampling-cancel">放弃</button><button type="submit" class="primary">保存</button></div></form></dialog><dialog id="logs"><div class="drawer-head"><div><h2 id="log-title">实例日志</h2><small>操作阶段与最终结果</small></div><button id="close-logs" aria-label="关闭">关闭</button></div><select id="log-filter"><option value="all">全部</option><option value="manual">人工</option><option value="schedule">定时</option><option value="rollover">续杯</option><option value="failed">错误</option></select><div id="log-items"></div></dialog><div id="toast" role="status" hidden></div><script src="/static/console.js"></script></body></html>
