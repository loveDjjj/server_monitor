<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OneDay · 计算工作台</title>
    <link rel="stylesheet" href="/static/console.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand" aria-label="OneDay 计算工作台">
        <span class="brand-mark" aria-hidden="true">O</span>
        <div class="brand-text"><b>OneDay</b><small>计算工作台</small></div>
      </div>
      <nav aria-label="主导航">
        <button data-tab="overview">概览</button
        ><button class="selected" data-tab="instances">CCI 实例</button
        ><button data-tab="acp">ACP 工作环境</button
        ><button data-tab="gpu">GPU 余量</button
        ><button data-tab="activity">操作记录</button>
      </nav>
      <small class="sidebar-foot">SenseCore · 本地控制台</small>
    </aside>
    <div class="workspace">
      <header>
        <span>工作空间 / share-space</span><span id="connection">连接中</span>
      </header>
      <main>
        <section id="overview-page" hidden>
          <div class="page-heading"><h1>概览</h1></div>
          <div id="overview-content"></div>
        </section>
        <section id="instances-page">
          <div class="page-heading">
            <h1>CCI 实例</h1>
            <div class="heading-actions">
              <button id="instance-count" title="编辑采样间隔"></button
              ><button id="add-instance" class="primary">添加实例</button>
            </div>
          </div>
          <div id="instances" class="cards"></div>
        </section>
        <section id="acp-page" hidden>
          <div class="page-heading">
            <h1>ACP 工作环境</h1>
            <div class="heading-actions">
              <input
                id="acp-search"
                class="search-field"
                type="search"
                placeholder="搜索任务"
                aria-label="搜索 ACP 任务"
              /><button id="acp-edit">环境设置</button>
            </div>
          </div>
          <div id="acp-content"></div>
        </section>
        <section id="activity-page" hidden>
          <div class="page-heading"><h1>操作记录</h1></div>
          <div id="activity-content"></div>
        </section>
        <section id="gpu-page" hidden>
          <div class="page-heading">
            <h1>GPU 余量</h1>
            <button id="gpu-edit">监控设置</button>
          </div>
          <div id="gpu-settings"></div>
          <div class="chart-panel">
            <div class="chart-toolbar">
              <select id="cluster-select" aria-label="集群"></select
              ><select id="hours" aria-label="时间范围">
                <option value="8">最近8小时</option>
                <option value="1">最近1小时</option>
                <option value="24">最近24小时</option></select
              ><span id="gpu-latest"></span>
            </div>
            <div class="chart">
              <canvas id="chart"></canvas>
              <div id="tooltip" hidden></div>
            </div>
            <p id="chart-note">空闲 GPU · 查询失败显示断点</p>
          </div>
        </section>
      </main>
    </div>
    <dialog id="edit-dialog" class="drawer" aria-label="实例设置"></dialog>
    <dialog id="acp-dialog" class="drawer" aria-label="ACP设置"></dialog>
    <dialog id="acp-detail" class="drawer" aria-label="ACP任务详情">
      <div class="drawer-head">
        <h2>任务详情</h2>
        <button onclick="this.closest('dialog').close()">关闭</button>
      </div>
      <div id="acp-detail-content"></div>
    </dialog>
    <dialog id="add-dialog" aria-labelledby="add-title">
      <h2 id="add-title">添加已有实例</h2>
      <form id="add-form" class="edit-form">
        <label
          >Workspace<input name="workspace" required maxlength="128" /></label
        ><label>实例名称<input name="name" required maxlength="128" /></label>
        <p id="add-error" class="error" role="alert" hidden></p>
        <div class="form-actions">
          <button id="add-cancel" type="button">取消</button
          ><button id="add-submit" type="submit" class="primary">
            查询并添加
          </button>
        </div>
      </form>
    </dialog>
    <dialog id="sampling-dialog" aria-labelledby="sampling-title">
      <h2 id="sampling-title">实例状态采样</h2>
      <form id="sampling-form" class="edit-form">
        <label
          >采样间隔（秒）<input
            name="interval"
            type="number"
            min="10"
            max="3600"
            step="1"
            required
        /></label>
        <p id="sampling-error" class="error" role="alert" hidden></p>
        <div class="form-actions">
          <button type="button" id="sampling-cancel">取消</button
          ><button type="submit" class="primary">保存</button>
        </div>
      </form>
    </dialog>
    <dialog id="logs" class="drawer">
      <div class="drawer-head">
        <h2 id="log-title">实例日志</h2>
        <button id="close-logs">关闭</button>
      </div>
      <select id="log-filter">
        <option value="all">全部</option>
        <option value="manual">人工</option>
        <option value="schedule">定时</option>
        <option value="auto_start">停止后自动启动</option>
        <option value="rollover">续杯</option>
        <option value="failed">错误</option>
      </select>
      <div id="log-items"></div>
    </dialog>
    <div id="toast" role="status" hidden></div>
    <script src="/static/common.js"></script>
    <script src="/static/console.js"></script>
    <script src="/static/acp.js"></script>
  </body>
</html>
