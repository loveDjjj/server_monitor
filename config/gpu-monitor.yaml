# 配置格式版本。
version: 2
# 是否启用当前功能。
enabled: true
# GPU余量采样间隔（秒），不影响实例调度。
interval_seconds: 10
# GPU历史数据保留时长（小时）。
history_hours: 8
# 只读监控的集群列表。
clusters:
# 本地唯一标识，也是状态和日志目录名称。
- key: debug-cluster
  # 平台资源名称，不是显示名称。
  name: debug-cluster
  # 管理台显示名称。
  display_name: H100 Debug
  # 集群总卡数的展示配置，不参与实例启停。
  total_gpus: 32
